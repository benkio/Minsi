<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minsi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container-fluid px-3 py-2">
      <!-- Header -->
      <div class="row app-header text-center">
        <div class="col">
          <h1 class="mb-0">Minsi</h1>
          <p class="text-muted">
            Opinionated YouTube Clip Video Gif Audio Extractor
          </p>
        </div>
      </div>

      <!-- Main content -->
      <div class="row g-3">
        <!-- Left controls -->
        <div class="col-12 col-lg-3">
          <div class="card control-card shadow-sm">
            <div class="card-body">
              <div class="mb-3">
                <label for="outputFilename" class="form-label"
                  >Output Filename</label
                >
                <input type="text" class="form-control" id="outputFilename" />
              </div>

              <div class="mb-3">
                <label for="artist" class="form-label">Artist</label>
                <input type="text" class="form-control" id="artist" />
              </div>

              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" />
              </div>

              <div class="form-check mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="reverseLoopGif"
                />
                <label class="form-check-label" for="reverseLoopGif">
                  Reverse / Loop GIF
                </label>
              </div>

              <div class="mb-3 range-group">
                <label for="cutStart" class="form-label small">
                  Start Time
                </label>
                <input
                  type="range"
                  class="form-range"
                  id="cutStart"
                  min="0"
                  max="100"
                  value="0"
                />
                <small class="text-muted">
                  <span id="cutStartValue">0</span>s
                </small>
              </div>

              <div class="range-group">
                <label for="cutEnd" class="form-label small"> End Time </label>
                <input
                  type="range"
                  class="form-range"
                  id="cutEnd"
                  min="0"
                  max="100"
                  value="100"
                />
                <small class="text-muted">
                  <span id="cutEndValue">100</span>s
                </small>
              </div>

              <div class="my-3">
                <button type="button" class="btn btn-success btn-sm mx-auto">
                  Cut Video
                </button>
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="reloadOnChange"
                />
                <label class="form-check-label" for="reloadOnChange">
                  Reload On Change
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Right preview -->
        <div class="col-12 col-lg-9">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <div class="mb-3">
                <label for="youtubeUrl" class="form-label">YouTube URL</label>
                <input
                  type="url"
                  class="form-control w-75 mx-auto"
                  id="youtubeUrl"
                  placeholder="https://www.youtube.com/watch?v=..."
                />
              </div>

              <video
                class="w-75 embed-responsive-item bg-dark"
                id="resultPreview"
                controls
              ></video>
            </div>
          </div>
        </div>
      </div>

      <!-- Subtitles -->
      <div class="w-75 mx-auto my-2">
        <div class="d-flex justify-content-end mb-2">
          <button type="button" class="btn btn-success btn-sm mx-auto">
            Apply Subtitles
          </button>
          <button type="button" class="btn btn-primary btn-sm mx-auto">
            Add Subtitles
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered table-sm bg-white shadow-sm">
            <thead class="table-light">
              <tr>
                <th style="width: 70px">Start</th>
                <th style="width: 70px">End</th>
                <th>Value</th>
                <th style="width: 140px">Font</th>
                <th style="width: 120px">Color</th>
                <th style="width: 100px">Position</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <input type="number" class="form-control form-control-sm" />
                </td>
                <td>
                  <input type="number" class="form-control form-control-sm" />
                </td>
                <td>
                  <textarea
                    class="form-control form-control-sm"
                    rows="2"
                  ></textarea>
                </td>
                <td>
                  <select class="form-select form-select-sm">
                    <option selected>Impact</option>
                    <option>Arial Black</option>
                  </select>
                </td>
                <td>
                  <select class="form-select form-select-sm">
                    <option selected>White</option>
                    <option>Black</option>
                    <option>Light Green</option>
                    <option>Light Orange</option>
                    <option>Yellow</option>
                  </select>
                </td>
                <td>
                  <select class="form-select form-select-sm">
                    <option>Top</option>
                    <option selected>Bottom</option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const cutStart = document.getElementById("cutStart");
      const cutEnd = document.getElementById("cutEnd");

      cutStart.addEventListener("input", (e) => {
        document.getElementById("cutStartValue").textContent = e.target.value;
        cutEnd.min = e.target.value;
      });

      cutEnd.addEventListener("input", (e) => {
        document.getElementById("cutEndValue").textContent = e.target.value;
        cutStart.max = e.target.value;
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
