name: Cleanup Docker Hub Images (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: "Docker image name (e.g. benkio/minsi)"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  cleanup:
    name: Delete tags older than 10 days
    runs-on: ubuntu-latest
    steps:
      - name: Prune Docker Hub tags by age
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RETENTION_DAYS: "10"
        run: |
          set -euo pipefail

          namespace="${IMAGE%%/*}"
          repository="${IMAGE#*/}"

          if [ -z "${namespace}" ] || [ -z "${repository}" ] || [ "${namespace}" = "${repository}" ]; then
            echo "IMAGE must be in the form namespace/repository, got: ${IMAGE}"
            exit 1
          fi

          token="$(
            curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.token'
          )"

          if [ -z "${token}" ] || [ "${token}" = "null" ]; then
            echo "Unable to authenticate to Docker Hub API"
            exit 1
          fi

          threshold_epoch="$(date -d "${RETENTION_DAYS} days ago" +%s)"
          echo "Deleting tags older than ${RETENTION_DAYS} days for ${IMAGE}"

          tags_url="https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags/?page_size=100"
          deleted_count=0
          checked_count=0

          while [ -n "${tags_url}" ] && [ "${tags_url}" != "null" ]; do
            page="$(curl -fsSL -H "Authorization: JWT ${token}" "${tags_url}")"
            tags_url="$(echo "${page}" | jq -r '.next')"

            while IFS=$'\t' read -r tag_name last_updated; do
              [ -z "${tag_name}" ] && continue
              [ -z "${last_updated}" ] && continue

              checked_count=$((checked_count + 1))
              updated_epoch="$(date -d "${last_updated}" +%s)"

              if [ "${updated_epoch}" -lt "${threshold_epoch}" ]; then
                echo "Deleting ${IMAGE}:${tag_name} (last_updated=${last_updated})"
                curl -fsSL -X DELETE \
                  -H "Authorization: JWT ${token}" \
                  "https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags/${tag_name}/" >/dev/null
                deleted_count=$((deleted_count + 1))
              else
                echo "Keeping ${IMAGE}:${tag_name} (last_updated=${last_updated})"
              fi
            done < <(
              echo "${page}" | jq -r '.results[] | [.name, .last_updated] | @tsv'
            )
          done

          echo "Checked ${checked_count} tags, deleted ${deleted_count} tags"
