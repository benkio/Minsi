name: DockerHub Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * MON"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Get Docker Hub JWT
        id: dockerhub_jwt
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          jwt="$(
            curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.token'
          )"

          if [ -z "${jwt}" ] || [ "${jwt}" = "null" ]; then
            echo "Failed to obtain Docker Hub JWT"
            exit 1
          fi

          echo "jwt=${jwt}" >> "${GITHUB_OUTPUT}"

      - name: Cleanup Docker Hub tags
        uses: maxisam/dockerhub-cleanup@v0.1.8
        with:
          namespace: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ steps.dockerhub_jwt.outputs.jwt }}
          repos: "minsi"
          preserve_last: "5"
          dry_run: "false"
