name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  shared:
    name: Shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PureScript
        uses: purescript-contrib/setup-purescript@main
        with:
          purescript: latest
          purs-tidy: latest
          spago: unstable
      - name: Cache PureScript dependencies (shared)
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-spago-shared-${{ hashFiles('shared/spago.yaml', 'shared/spago.lock', 'shared/src/**/*.purs', 'shared/test/**/*.purs') }}
          path: shared/.spago
      - name: Check Formatting
        working-directory: shared
        run: purs-tidy check "src/**/*.purs" && purs-tidy check "test/**/*.purs"
      - name: Build shared
        working-directory: shared
        run: spago build
      - name: Test shared
        working-directory: shared
        run: spago test
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
      - name: Setup PureScript
        uses: purescript-contrib/setup-purescript@main
        with:
          purescript: latest
          purs-tidy: latest
          spago: unstable
      - name: Cache PureScript dependencies (backend)
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-spago-backend-${{ hashFiles('backend/spago.yaml', 'backend/spago.lock', 'backend/src/**/*.purs', 'backend/test/**/*.purs') }}
          path: backend/.spago
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check Formatting
        working-directory: backend
        run: purs-tidy check "src/**/*.purs" && purs-tidy check "test/**/*.purs"
      - name: Build backend
        working-directory: backend
        run: spago build
      - name: Test backend
        working-directory: backend
        run: spago test
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
      - name: Setup PureScript
        uses: purescript-contrib/setup-purescript@main
        with:
          purescript: latest
          purs-tidy: latest
          spago: unstable
      - name: Cache PureScript dependencies (frontend)
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-spago-frontend-${{ hashFiles('frontend/spago.yaml', 'frontend/spago.lock', 'frontend/src/**/*.purs', 'frontend/test/**/*.purs') }}
          path: frontend/.spago
      - name: Check Formatting
        working-directory: frontend
        run: purs-tidy check "src/**/*.purs" && purs-tidy check "test/**/*.purs"
      - name: Build frontend
        working-directory: frontend
        run: spago build
      - name: Test frontend
        working-directory: frontend
        run: spago test
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t minsi:ci .
      - name: Run Docker container
        run: docker run -d --name minsi -p 8080:8080 --network host minsi:ci
      - name: Wait for server to be ready
        run: >
          echo "Waiting for server to become ready..."

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/checkDependencies -X POST 2>/dev/null | grep -q 200; then
              echo "✓ Server is ready"
              exit 0
            fi
            echo "Attempt $i/60 - Server not ready yet, waiting..."
            sleep 1
          done

          echo "✗ Server did not start in time"

          docker logs minsi || true

          docker ps -a || true

          exit 1
      - name: Call CheckDependencies endpoint
        run: >
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST
          http://localhost:8080/checkDependencies)

          echo "HTTP status: $HTTP_STATUS"

          cat /tmp/response.txt || echo "No response body"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "✗ CheckDependencies failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "✓ CheckDependencies endpoint responding correctly"
      - name: Save Docker image (for optional publish)
        if: github.ref == 'refs/heads/main'
        run: docker save minsi:ci -o /tmp/minsi-image.tar && ls -lh /tmp/minsi-image.tar
      - name: Upload Docker image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: minsi-docker-image
          path: /tmp/minsi-image.tar
          if-no-files-found: warn
      - name: Stop Docker container
        if: always()
        run: docker rm -f minsi || true
  publish_approval:
    name: Publish Docker image?
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - shared
      - backend
      - frontend
      - docker
    environment: dockerhub-publish
    steps:
      - name: Await approval
        run: echo "Publishing approved. Proceeding to publish job."
  publish_docker_image:
    name: Publish Docker image
    if: github.ref == 'refs/heads/main'
    needs:
      - publish_approval
    uses: benkio/minsi/.github/workflows/publish-docker-image.yml@main
    with:
      source: artifact
      artifact_name: minsi-docker-image
      tag: latest
      image: benkio/minsi
    secrets: inherit
