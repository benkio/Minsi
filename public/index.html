<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minsi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container-fluid px-3 px-lg-4 py-3">
      <!-- Header -->
      <div class="row text-center mb-4">
        <div class="col">
          <h1 class="mb-1">Minsi</h1>
          <p class="text-muted mb-0">
            Opinionated YouTube Clip Video Gif Audio Extractor
          </p>
        </div>
      </div>

      <!-- Main content -->
      <div class="row gy-4">
        <!-- Left controls -->
        <div class="col-12 col-lg-3">
          <div class="card shadow-sm mb-3">
            <div class="card-body">
              <div class="mb-3">
                <label for="outputFilename" class="form-label">
                  Output Filename
                </label>
                <input type="text" class="form-control" id="outputFilename" />
              </div>

              <div class="mb-3">
                <label for="artist" class="form-label">Artist</label>
                <input type="text" class="form-control" id="artist" />
              </div>

              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" />
              </div>

              <div class="form-check mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="reverseLoopGif"
                />
                <label class="form-check-label" for="reverseLoopGif">
                  Reverse / Loop GIF
                </label>
              </div>

              <div class="mb-4">
                <label for="cutStart" class="form-label small">
                  Start Time
                </label>
                <input
                  type="range"
                  class="form-range"
                  id="cutStart"
                  min="0"
                  max="100"
                  value="0"
                />
                <small class="text-muted">
                  <span id="cutStartValue">0</span>s
                </small>
              </div>

              <div>
                <label for="cutEnd" class="form-label small"> End Time </label>
                <input
                  type="range"
                  class="form-range"
                  id="cutEnd"
                  min="0"
                  max="100"
                  value="100"
                />
                <small class="text-muted">
                  <span id="cutEndValue">100</span>s
                </small>
              </div>
            </div>
          </div>

          <div class="card bg-black border border-success text-success">
            <div
              class="card-header bg-black border-success fw-bold font-monospace text-center py-2"
            >
              😺 MINSI LOG 😺
            </div>
            <div
              id="minsiLog"
              class="card-body font-monospace small"
              style="height: 120px; overflow-y: auto"
            ></div>
          </div>
        </div>

        <!-- Right preview -->
        <div class="col-12 col-lg-9">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <div class="mb-4">
                <label for="youtubeUrl" class="form-label"> YouTube URL </label>
                <input
                  type="url"
                  class="form-control w-100 w-md-75 mx-auto"
                  pattern="https?://(www\.)?(youtube\.com|youtu\.be)/.+"
                  id="youtubeUrl"
                  placeholder="https://www.youtube.com/watch?v=..."
                />
              </div>

              <div
                class="w-100 w-md-75 mx-auto bg-dark mb-3"
                id="resultPreview"
              ></div>
            </div>

            <div class="row text-center align-items-center gy-2 px-3 pb-3">
              <div class="col-12 col-md-3 col-lg-2">
                <button id="setCutStartButton" class="btn btn-primary w-100">
                  Set Start Position
                </button>
              </div>

              <div class="col-12 col-md-3 col-lg-4">
                <p class="mb-0">
                  playback position:
                  <span id="playbackPosition">0</span>
                </p>
              </div>

              <div class="col-12 col-md-3 col-lg-4">
                <div
                  class="d-flex justify-content-center align-items-center gap-2"
                >
                  <span>Video Source:</span>
                  <select
                    name="videoSource"
                    id="videoSource"
                    class="form-select form-select-sm w-auto"
                  >
                    <option value="youtube">YouTube</option>
                    <option value="video">Video</option>
                    <option value="gif">Gif</option>
                  </select>
                </div>
              </div>

              <div class="col-12 col-md-3 col-lg-2">
                <button id="setCutEndButton" class="btn btn-primary w-100">
                  Set End Position
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Subtitles -->
      <div class="row mt-4">
        <div class="col-12 col-xl-10 mx-auto">
          <div class="d-flex justify-content-center mb-3">
            <button
              id="applyButton"
              type="button"
              class="btn btn-primary btn-lg px-5"
            >
              Apply
            </button>
          </div>

          <div class="table-responsive">
            <table
              class="table table-bordered table-sm bg-white shadow-sm align-middle"
            >
              <thead class="table-light text-center">
                <tr>
                  <th style="width: 70px">Start</th>
                  <th style="width: 70px">End</th>
                  <th>Value</th>
                  <th style="width: 140px">Font</th>
                  <th style="width: 120px">Color</th>
                  <th style="width: 100px">Position</th>
                  <th style="width: 80px"></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <input type="number" class="form-control form-control-sm" />
                  </td>
                  <td>
                    <input type="number" class="form-control form-control-sm" />
                  </td>
                  <td>
                    <textarea
                      class="form-control form-control-sm"
                      rows="2"
                    ></textarea>
                  </td>
                  <td>
                    <select class="form-select form-select-sm">
                      <option selected>Impact</option>
                      <option>Arial Black</option>
                    </select>
                  </td>
                  <td>
                    <select class="form-select form-select-sm">
                      <option selected>White</option>
                      <option>Black</option>
                      <option>Light Green</option>
                      <option>Light Orange</option>
                      <option>Yellow</option>
                    </select>
                  </td>
                  <td>
                    <select class="form-select form-select-sm">
                      <option>Top</option>
                      <option selected>Bottom</option>
                    </select>
                  </td>
                  <td class="text-center">
                    <button
                      id="addSubtitleButton"
                      type="button"
                      class="btn btn-sm btn-outline-primary"
                    >
                      ➕
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Modal -->
    <div
      class="modal fade"
      id="loadingModal"
      tabindex="-1"
      aria-hidden="true"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4">
          <div class="modal-body">
            <div class="spinner-border text-primary mb-3" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <div>Cutting the Video, please wait…</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
